// ==================== CRASH ANALYZER ====================  
class CrashAnalyzer {  
  constructor() {  
    this.history = this.loadHistory();  
  }  
  
  loadHistory() {  
    try {  
      const data = localStorage.getItem('aviator-crash-history');  
      return data ? JSON.parse(data) : [];  
    } catch {  
      return [];  
    }  
  }  
  
  saveHistory() {  
    try {  
      const toSave = this.history.slice(-500);  
      localStorage.setItem('aviator-crash-history', JSON.stringify(toSave));  
    } catch (e) {  
      console.error('Erro ao salvar:', e);  
    }  
  }  
  
  addCrash(multiplier) {  
    const crash = {  
      id: Date.now().toString(),  
      round: this.history.length + 1,  
      multiplier: parseFloat(multiplier.toFixed(2)),  
      timestamp: Date.now(),  
      date: new Date().toLocaleString('pt-BR')  
    };  
    this.history.push(crash);  
    this.saveHistory();  
    return crash;  
  }  
  
  predictNextCrash() {  
    if (this.history.length < 5) {  
      return {  
        predictedCrash: 1.5,  
        confidence: 0.2,  
        signal: 'WAIT',  
        reason: '⏳ Histórico insuficiente. Adicione mais crashes.'  
      };  
    }  
  
    const recent = this.history.slice(-50).map(c => c.multiplier);  
    const average = recent.reduce((a, b) => a + b, 0) / recent.length;  
    const stdDev = Math.sqrt(recent.reduce((sum, val) => sum + Math.pow(val - average, 2), 0) / recent.length);  
    const lastCrash = recent[recent.length - 1];  
  
    let predicted = average;  
    let confidence = 0.5;  
    let signal = 'BUY';  
    let reason = '';  
  
    // Análise de volatilidade  
    const volatility = stdDev / average;  
    if (volatility > 0.8) {  
      predicted *= 0.85;  
      confidence -= 0.15;  
    }  
  
    // Análise de tendência  
    const recentAvg = recent.slice(-10).reduce((a, b) => a + b) / 10;  
    const olderAvg = recent.slice(-20, -10).reduce((a, b) => a + b) / 10;  
    const trend = (recentAvg - olderAvg) / olderAvg;  
  
    if (trend > 0.1) {  
      predicted *= 1.1;  
      confidence += 0.1;  
    }  
  
    confidence = Math.max(0.2, Math.min(1, confidence));  
  
    // Determinar sinal  
    if (confidence < 0.4) {  
      signal = 'WAIT';  
      reason = '⏸️ Confiança baixa. Aguarde mais dados.';  
    } else if (lastCrash < average * 0.7) {  
      signal = 'BUY';  
      reason = `✅ Último crash baixo (${lastCrash.toFixed(2)}x). Possível recuperação!`;  
    } else if (lastCrash > average * 1.3) {  
      signal = 'PASS';  
      reason = `⛔ Último crash alto (${lastCrash.toFixed(2)}x). Possível reversão.`;  
    } else {  
      signal = 'BUY';  
      reason = `✅ Mercado neutro. Previsão média: ${predicted.toFixed(2)}x`;  
    }  
  
    return {  
      predictedCrash: Math.max(1.01, predicted),  
      confidence: parseFloat(confidence.toFixed(2)),  
      signal,  
      reason  
    };  
  }  
  
  getStats() {  
    if (this.history.length === 0) {  
      return {  
        total: 0,  
        average: 0,  
        highest: 0,  
        lowest: 0,  
        median: 0,  
        winRate: '0'  
      };  
    }  
  
    const vals = this.history.map(c => c.multiplier);  
    const sorted = [...vals].sort((a, b) => a - b);  
    const average = vals.reduce((a, b) => a + b) / vals.length;  
    const median = sorted[Math.floor(sorted.length / 2)];  
    const winRate = (vals.filter(v => v > average).length / vals.length * 100).toFixed(1);  
  
    return {  
      total: this.history.length,  
      average: average.toFixed(2),  
      highest: Math.max(...vals).toFixed(2),  
      lowest: Math.min(...vals).toFixed(2),  
      median: median.toFixed(2),  
      winRate  
    };  
  }  
  
  getRecent(limit = 20) {  
    return [...this.history].slice(-limit).reverse();  
  }  
  
  getChartData() {  
    return this.history.slice(-50).map((c, i) => ({  
      x: i + 1,  
      y: c.multiplier  
    }));  
  }  
  
  clear() {  
    if (confirm('⚠️ Tem certeza? Isso não pode ser desfeito!')) {  
      this.history = [];  
      localStorage.removeItem('aviator-crash-history');  
      return true;  
    }  
    return false;  
  }  
}  
  
// ==================== LIVE SIMULATOR ====================  
class CrashSimulator {  
  constructor() {  
    this.currentMultiplier = 1.0;  
    this.isRunning = false;  
    this.listeners = [];  
    this.crashListeners = [];  
  }  
  
  generateCrashPoint() {  
    const rand = Math.random();  
    if (rand < 0.30) return 1 + Math.random() * 0.5;      // 1.0-1.5 (30%)  
    if (rand < 0.60) return 1.5 + Math.random() * 1.5;    // 1.5-3.0 (30%)  
    if (rand < 0.85) return 3 + Math.random() * 3;        // 3.0-6.0 (25%)  
    if (rand < 0.95) return 6 + Math.random() * 6;        // 6.0-12.0 (10%)  
    return 12 + Math.random() * 18;                       // 12.0-30.0 (5%)  
  }  
  
  start() {  
    if (this.isRunning) return;  
    this.isRunning = true;  
    this.currentMultiplier = 1.0;  
  
    const crashPoint = this.generateCrashPoint();  
    const startTime = Date.now();  
    const duration = crashPoint * 200 + 1000;  
  
    const animate = () => {  
      if (!this.isRunning) return;  
  
      const elapsed = Date.now() - startTime;  
      const progress = Math.min(elapsed / duration, 1);  
  
      this.currentMultiplier = 1 + (crashPoint - 1) * progress;  
      this.notifyListeners(this.currentMultiplier);  
  
      if (progress < 1) {  
        requestAnimationFrame(animate);  
      } else {  
        this.stop(crashPoint);  
      }  
    };  
  
    requestAnimationFrame(animate);  
  }  
  
  stop(finalMultiplier) {  
    this.isRunning = false;  
    this.currentMultiplier = finalMultiplier;  
    this.notifyListeners(finalMultiplier);  
    this.notifyCrashListeners(finalMultiplier);  
  }  
  
  addListener(cb) {  
    this.listeners.push(cb);  
  }  
  
  addCrashListener(cb) {  
    this.crashListeners.push(cb);  
  }  
  
  notifyListeners(mult) {  
    this.listeners.forEach(cb => cb(mult));  
  }  
  
  notifyCrashListeners(mult) {  
    this.crashListeners.forEach(cb => cb(mult));  
  }  
}  
  
// ==================== APP STATE ====================

// ==================== FUNCTIONS ====================  
function startGame() {  
  simulator.start();  
  renderApp();  
  simulator.addCrashListener((crash) => {  
    analyzer.addCrash(crash);  
    renderApp();  
  });  
}  
  
function stopGame() {  
  simulator.isRunning = false;  
  renderApp();  
}  
  
function clearHistory() {  
  if (analyzer.clear()) {  
    renderApp();  
  }  
}  
  
function toggleTheme() {  
  document.documentElement.classList.toggle('dark');  
  const themeBtn = document.getElementById('themeBtn');  
  if (themeBtn) {  
    themeBtn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';  
  }  
}  
  
function updateChart() {  
  const ctx = document.getElementById('gameChart');  
  if (!ctx) return;  
  
  const data = analyzer.getChartData();  
    
  if (chartInstance) {  
    chartInstance.destroy();  
  }  
  
  chartInstance = new Chart(ctx, {  
    type: 'line',  
    data: {  
      labels: data.map(d => d.x),  
      datasets: [{  
        label: 'Multiplicador',  
        data: data.map(d => d.y),  
        borderColor: '#fbbf24',  
        backgroundColor: 'rgba(251, 191, 36, 0.1)',  
        borderWidth: 3,  
        fill: true,  
        tension: 0.4,  
        pointRadius: 4,  
        pointBackgroundColor: '#fbbf24',  
        pointBorderColor: '#fff',  
        pointBorderWidth: 2  
      }]  
    },  
    options: {  
      responsive: true,  
      maintainAspectRatio: true,  
      plugins: {  
        legend: {  
          labels: { color: '#9ca3af', font: { size: 12 } }  
        }  
      },  
      scales: {  
        y: {  
          beginAtZero: true,  
          grid: { color: 'rgba(75, 85, 99, 0.2)' },  
          ticks: { color: '#9ca3af' }  
        },

          grid: { color: 'rgba(75, 85, 99, 0.2)' },  
          ticks: { color: '#9ca3af' }  
        }  
      }  
    }  
  });  
}

// Initial render

</script>  </body>
